<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
  </head>

  <body bgcolor="pink">
    <br /><br /><br /><br />

    <center>
      <form>
        <fieldset style="width: 300px">
          <legend>
            <font color="red" size="5"><b>Log In</b></font>
          </legend>

          <div align="left">
            User Name:
            <input type="text" value="Enter your User name here!" />
            <br />

            PassWord:
            <input type="password" />
            <br />

            Select Your Location:
            <select>
              <optgroup label="Africa">
                <option selected>Egypt</option>
                <option>Sudan</option>
                <option>Namibia</option>
              </optgroup>

              <optgroup label="Europe">
                <option>France</option>
                <option>Russia</option>
                <option>UK</option>
              </optgroup>

              <optgroup label="North America" disabled>
                <option>Canada</option>
                <option>Mexico</option>
                <option>USA</option>
              </optgroup>
            </select>
            <br />

            &nbsp;&nbsp;<input type="checkbox" /> Remember<u>M</u>e <br /><br />

            <input type="submit" value="Log In" />
          </div>
        </fieldset>
      </form>
    </center>
  </body>
</html>
