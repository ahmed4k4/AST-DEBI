<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration</title>
  </head>

  <body bgcolor="pink">
    <form>
      <table border="10" bordercolor="#FFA3BF" align="center" cellpadding="4">
        <tr>
          <td>First Name</td>
          <td><input type="text" /></td>
        </tr>

        <tr>
          <td>Last Name</td>
          <td><input type="text" /></td>
        </tr>

        <tr>
          <td>Password</td>
          <td><input type="password" /></td>
        </tr>

        <tr>
          <td rowspan="2" align="center"><b>Gender</b></td>
          <td><input type="radio" name="gender" /> Male</td>
        </tr>
        <tr>
          <td><input type="radio" name="gender" /> Female</td>
        </tr>

        <tr>
          <td>
            Birthday:
            <select>
              <option>Select a Month</option>
              <option>January</option>
              <option>February</option>
              <option>March</option>
              <option>April</option>
              <option>May</option>
              <option>June</option>
              <option>July</option>
              <option>August</option>
              <option>September</option>
              <option>October</option>
              <option>November</option>
              <option>December</option>
            </select>
          </td>
          <td>
            <input type="text" size="2" placeholder="dd" />
            <input type="text" size="4" placeholder="yyyy" />
          </td>
        </tr>

        <tr>
          <td colspan="2" align="center">
            <b
              ><u><font size="5">Interests</font></u></b
            >
          </td>
        </tr>

        <tr>
          <td><input type="checkbox" /> Sports</td>
          <td><input type="checkbox" /> Music</td>
        </tr>

        <tr>
          <td><input type="checkbox" /> Books</td>
          <td><input type="checkbox" /> Computer Stuff</td>
        </tr>

        <tr>
          <td><input type="checkbox" /> Fashion</td>
          <td><input type="checkbox" /> Movies</td>
        </tr>

        <tr>
          <td colspan="2" align="center">
            <input type="submit" value="Submit" />
          </td>
        </tr>
      </table>
    </form>
  </body>
</html>
